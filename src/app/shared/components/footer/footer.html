  >
    <!-- Left Section: Useful Links -->
    <div class="flex flex-col max-w-3xl">
      <h3 class="text-[15px] font-bold uppercase tracking-wider text-white mb-4">USEFUL LINKS</h3>

      <!-- Links Grid (2 Columns with exact horizontal spacing) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-20 sm:gap-x-32 gap-y-2 text-[15px]">
        <a
          routerLink="/website-policies"
          class="text-white hover:text-blue-200 no-underline flex items-center gap-2 transition-colors font-normal"
        >
          <span class="text-white/80">›</span> <span>Website Policies</span>
        </a>
        <a
          routerLink="/contact-us"
          class="text-white hover:text-blue-200 no-underline flex items-center gap-2 transition-colors font-normal"
        >
          <span class="text-white/80">›</span> <span>Contact Us</span>
        </a>
        <a
          routerLink="/faq"

        <a

    >
      <div class="flex flex-col text-[15px] text-white space-y-1">
        <div>
          Total Visitors:
          <span class="font-normal text-white">
            {{ visitorCount() }}
          </span>
        </div>
      </div>

      <div class="mt-1">
        <div class="bg-white rounded px-2 py-1 inline-block shadow-xs">
