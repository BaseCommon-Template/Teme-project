@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
    (click)="onBackdropClick($event)"
  >
    <div
      class="w-full max-w-md bg-white border border-slate-100 rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200"
    >
      <!-- Header -->
      <div
        class="px-6 py-4 bg-linear-to-r from-[#1a2a6c] to-[#1e3a8a] text-white flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <span class="text-xl">🛡️</span>
          <div>
            <h3 class="text-base font-bold m-0 leading-tight">
              {{ editingRole ? 'Edit Security Role' : 'Create Security Role' }}
            </h3>
            <p class="text-[11px] text-blue-200 m-0">
              Access permissions and authentication policies
            </p>
          </div>
        </div>
        <button
          (click)="onClose()"
          class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer border-none"
        >
          ✕
        </button>
      </div>

      <!-- Form Body -->
      <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
        @if (error()) {
          <div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-semibold">
            {{ error() }}
          </div>
        }

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1"> Numeric Role ID * </label>
            <input
              type="number"
              [(ngModel)]="formData.role_id"
              name="role_id"
              required
              [disabled]="!!editingRole"
              placeholder="e.g. 101"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-slate-100"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1"> Priority Level * </label>
            <input
              type="number"
              [(ngModel)]="formData.priority"
              name="priority"
              required
              min="1"
              placeholder="1 (Highest)"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1"> Role Name / Title * </label>
          <input
            type="text"
            [(ngModel)]="formData.role_name"
            name="role_name"
            required
            placeholder="e.g. CAPF Nodal Officer"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1"> OTP Enforcement </label>
            <select
              [(ngModel)]="formData.otp_based"
              name="otp_based"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
            >
              <option value="N">No (Password Only)</option>
              <option value="Y">Yes (2FA Required)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1"> IP Restriction </label>
            <select
              [(ngModel)]="formData.ip_based"
              name="ip_based"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
            >
              <option value="N">No</option>
              <option value="Y">Yes</option>
            </select>
          </div>
        </div>

        @if (formData.ip_based === 'Y') {
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              Allowed IP Address / Subnet
            </label>
            <input
              type="text"
              [(ngModel)]="formData.ip_address"
              name="ip_address"
              placeholder="e.g. 10.0.0.1 or 192.168.1.0/24"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
          </div>
        }

        <div class="flex items-center gap-2 pt-1">
          <input
            type="checkbox"
            [(ngModel)]="formData.is_active"
            name="is_active"
            id="role_is_active"
            class="rounded text-blue-600 focus:ring-blue-500"
          />
          <label for="role_is_active" class="text-xs font-bold text-slate-700 cursor-pointer">
            Role is Active & Enabled
          </label>
        </div>

        <!-- Modal Footer -->
        <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-3">
          <button
            type="button"
            (click)="onClose()"
            class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer border-none"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="submitting()"
            class="px-5 py-2 rounded-xl bg-[#1C4587] hover:bg-[#153466] text-white text-xs font-bold shadow-sm transition-all cursor-pointer border-none disabled:opacity-50"
          >
            {{ submitting() ? 'Saving...' : editingRole ? 'Update Role' : 'Create Role' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
