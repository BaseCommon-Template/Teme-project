@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
    (click)="onBackdropClick($event)"
  >
    <div
      class="w-full max-w-md bg-white border border-slate-100 rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200"
    >
      <!-- Header -->
      <div
        class="px-6 py-4 bg-linear-to-r from-[#46584b] to-[#355f2d] text-white flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <span class="text-xl">🏢</span>
          <div>
            <h3 class="text-base font-bold m-0 leading-tight">
              {{ editingEntity ? 'Edit Organization Type' : 'Create New Organization Type' }}
            </h3>
            <p class="text-[11px] text-blue-200 m-0">Ministry / CAPF / State Admin Level</p>
          </div>
        </div>
        <button
          (click)="onClose()"
          class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer border-none"
        >
          ✕
        </button>
      </div>

      <!-- Body Form -->
      <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
        @if (error()) {
          <div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-semibold">
            {{ error() }}
          </div>
        }

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1"> Entity Name * </label>
          <input
            type="text"
            [(ngModel)]="formData.entity_name"
            name="entity_name"
            required
            placeholder="e.g. Central Armed Police Forces"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">
            Short Name / Acronym *
          </label>
          <input
            type="text"
            [(ngModel)]="formData.short_name"
            name="short_name"
            required
            placeholder="e.g. CAPF"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1"> Description </label>
          <textarea
            [(ngModel)]="formData.description"
            name="description"
            rows="3"
            placeholder="Brief description of the organization type..."
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none"
          ></textarea>
        </div>

        <!-- Modal Footer -->
        <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-3">
          <button
            type="button"
            (click)="onClose()"
            class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer border-none"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="submitting()"
            class="px-5 py-2 rounded-xl bg-[#355f2d] hover:bg-[#46584b] text-white text-xs font-bold shadow-sm transition-all cursor-pointer border-none disabled:opacity-50"
          >
            {{ submitting() ? 'Saving...' : editingEntity ? 'Update Entity' : 'Save Entity' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
