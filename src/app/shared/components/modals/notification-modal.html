@if (isOpen) {
      <div
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
        (click)="onBackdropClick($event)"
      >
        <div class="w-full max-w-2xl bg-white border border-slate-100 rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col animate-in fade-in zoom-in-95 duration-200">
          <!-- Header -->
          <div class="px-6 py-4 bg-gradient-to-r from-[#1a2a6c] to-[#1e3a8a] text-white flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
              <span class="text-xl">📢</span>
              <div>
                <h3 class="text-base font-bold m-0 leading-tight">
                  {{ editingNotification ? 'Edit Recruitment Opening' : 'Create New Recruitment Opening' }}
                </h3>
                <p class="text-[11px] text-blue-200 m-0">Publish vacancy notice for Agniveer candidates</p>
              </div>
            </div>
            <button
              (click)="onClose()"
              class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer border-none"
            >
              ✕
            </button>
          </div>

          <!-- Form Body -->
          <form (ngSubmit)="onSubmit()" class="p-6 overflow-y-auto space-y-4 flex-1">
            @if (error()) {
              <div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-semibold">
                {{ error() }}
              </div>
            }

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">
                Notification Title *
              </label>
              <input
                type="text"
                [(ngModel)]="formData.notification_title"
                name="notification_title"
                required
                placeholder="e.g. Recruitment of Constables (GD) in CAPFs - 2026"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Advertisement / Notice No. *
                </label>
                <input
                  type="text"
                  [(ngModel)]="formData.advertisement_number"
                  name="advertisement_number"
                  required
                  placeholder="e.g. CAPF-GD-2026-01"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Official Attachment Link (PDF URL)
                </label>
                <input
                  type="url"
                  [(ngModel)]="formData.job_link_url"
                  name="job_link_url"
                  placeholder="https://mha.gov.in/recruitment-2026.pdf"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Issuing Organization *
                </label>
                <select
                  [(ngModel)]="formData.entity_id"
                  name="entity_id"
                  required
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
                >
                  <option value="" disabled>Select Organization</option>
                  @for (entity of entities; track entity._id) {
                    <option [value]="entity._id">{{ entity.entity_name }} ({{ entity.short_name }})</option>
                  }
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Sub-Entity / Force Unit
                </label>
                <select
                  [(ngModel)]="formData.sub_entity_id"
                  name="sub_entity_id"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
                >
                  <option value="">All / General MHA</option>
                  @for (sub of filteredSubEntities(); track sub._id) {
                    <option [value]="sub._id">{{ sub.sub_entity_name }}</option>
                  }
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Date of Advt. *
                </label>
                <input
                  type="date"
                  [(ngModel)]="formData.date_of_advertisement"
                  name="date_of_advertisement"
                  required
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
                />
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Opening Date *
                </label>
                <input
                  type="date"
                  [(ngModel)]="formData.application_opening_date"
                  name="application_opening_date"
                  required
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
                />
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Closing Date *
                </label>
                <input
                  type="date"
                  [(ngModel)]="formData.application_closing_date"
                  name="application_closing_date"
                  required
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
                />
              </div>
            </div>

            <!-- Post Preferences Selection -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">
                Applicable Posts / Trades
              </label>
              <div class="flex flex-wrap gap-2 p-3 bg-slate-50 border border-slate-200 rounded-xl max-h-32 overflow-y-auto">
                @for (post of allPosts(); track post._id) {
                  <label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs cursor-pointer select-none">
                    <input
                      type="checkbox"
                      [checked]="isPostSelected(post.post_name)"
                      (change)="togglePost(post.post_name)"
                      class="rounded text-blue-600 focus:ring-blue-500"
                    />
                    <span>{{ post.post_name }}</span>
                  </label>
                }
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">
                Detailed Narration / Requirements
              </label>
              <textarea
                [(ngModel)]="formData.description"
                name="description"
                rows="4"
                placeholder="Details on eligibility, reservation, age relaxations..."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none resize-y"
              ></textarea>
            </div>

            <!-- Modal Footer -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-3 shrink-0">
              <button
                type="button"
                (click)="onClose()"
                class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer border-none"
              >
                Cancel
              </button>
              <button
                type="submit"
                [disabled]="submitting()"
                class="px-5 py-2 rounded-xl bg-[#1C4587] hover:bg-[#153466] text-white text-xs font-bold shadow-sm transition-all cursor-pointer border-none disabled:opacity-50"
              >
                {{ submitting() ? 'Publishing...' : (editingNotification ? 'Update Opening' : 'Publish Opening') }}
              </button>
            </div>
          </form>
        </div>
      </div>
    }
