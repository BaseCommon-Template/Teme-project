@if (isOpen) {
      <div
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
        (click)="onBackdropClick($event)"
      >
        <div class="w-full max-w-xl bg-white border border-slate-100 rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col animate-in fade-in zoom-in-95 duration-200">
          <!-- Header -->
          <div class="px-6 py-4 bg-gradient-to-r from-[#1a2a6c] to-[#1e3a8a] text-white flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
              <span class="text-xl">🏛️</span>
              <div>
                <h3 class="text-base font-bold m-0 leading-tight">
                  {{ isEditing ? 'Edit Organization Unit' : 'Add Organization Unit' }}
                </h3>
                <p class="text-[11px] text-blue-200 m-0">BSF, CISF, CRPF, Assam Rifles, State Police Dept</p>
              </div>
            </div>
            <button
              (click)="onClose()"
              class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer border-none"
            >
              ✕
            </button>
          </div>

          <!-- Form Body -->
          <form (ngSubmit)="onSubmit()" class="p-6 overflow-y-auto space-y-4 flex-1">
            @if (error()) {
              <div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-semibold">
                {{ error() }}
              </div>
            }

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Parent Organization *
                </label>
                <select
                  [(ngModel)]="formData.parent_entity_id"
                  name="parent_entity_id"
                  required
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
                >
                  <option value="" disabled>Select parent organization</option>
                  @for (entity of entities; track entity._id) {
                    <option [value]="entity._id">{{ entity.entity_name }} ({{ entity.short_name }})</option>
                  }
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Sub-Entity Short Name *
                </label>
                <input
                  type="text"
                  [(ngModel)]="formData.short_name"
                  name="short_name"
                  required
                  placeholder="e.g. BSF, CISF, CRPF"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">
                Sub-Entity Full Name *
              </label>
              <input
                type="text"
                [(ngModel)]="formData.sub_entity_name"
                name="sub_entity_name"
                required
                placeholder="e.g. Border Security Force"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">
                Headquarters Address
              </label>
              <input
                type="text"
                [(ngModel)]="formData.hq_street_address"
                name="hq_street_address"
                placeholder="Street address / Block"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">City</label>
                <input
                  type="text"
                  [(ngModel)]="formData.hq_city"
                  name="hq_city"
                  placeholder="e.g. New Delhi"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">State / UT</label>
                <input
                  type="text"
                  [(ngModel)]="formData.hq_state"
                  name="hq_state"
                  placeholder="e.g. Delhi"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Pincode</label>
                <input
                  type="number"
                  [(ngModel)]="formData.hq_pincode"
                  name="hq_pincode"
                  placeholder="110001"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">
                Official Website URL
              </label>
              <input
                type="url"
                [(ngModel)]="formData.official_website_url"
                name="official_website_url"
                placeholder="https://bsf.gov.in"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>

            <!-- Footer Buttons -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-3 shrink-0">
              <button
                type="button"
                (click)="onClose()"
                class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer border-none"
              >
                Cancel
              </button>
              <button
                type="submit"
                [disabled]="submitting()"
                class="px-5 py-2 rounded-xl bg-[#1C4587] hover:bg-[#153466] text-white text-xs font-bold shadow-sm transition-all cursor-pointer border-none disabled:opacity-50"
              >
                {{ submitting() ? 'Saving...' : (isEditing ? 'Update Sub-Entity' : 'Save Sub-Entity') }}
              </button>
            </div>
          </form>
        </div>
      </div>
    }
