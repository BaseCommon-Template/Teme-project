@if (isVisible()) {
      <button
        (click)="scrollToTop()"
        class="fixed bottom-6 right-6 z-50 p-3 rounded-full bg-[#355f2d] text-white shadow-xl hover:bg-[#46584b] hover:scale-110 transition-all duration-300 flex items-center justify-center cursor-pointer border border-white/20"
        title="Back to Top"
        aria-label="Back to Top"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M5 10l7-7m0 0l7 7m-7-7v18"
          />
        </svg>
      </button>
    }
