<aside class="w-72 bg-white border-r border-slate-200 flex flex-col h-full shadow-xs text-xs">
      <!-- Header -->
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <span class="text-sm">🔍</span>
          <span class="font-bold text-slate-800 uppercase tracking-wider">Candidate Filters</span>
        </div>
        <button
          (click)="onReset()"
          class="text-[11px] font-bold text-blue-600 hover:text-blue-800 cursor-pointer border-none bg-transparent"
        >
          Reset
        </button>
      </div>

      <!-- Filters List -->
      <div class="p-5 overflow-y-auto space-y-4 flex-1">
        <!-- Service Number / ID Search -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Service No. / ID</label>
          <input
            type="text"
            [ngModel]="filterService.filters().service_number"
            (ngModelChange)="onFilterChange('service_number', $event)"
            placeholder="Search by ID..."
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Armed Force Branch -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Defence Force</label>
          <select
            [ngModel]="filterService.filters().defence_force"
            (ngModelChange)="onFilterChange('defence_force', $event)"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
          >
            <option value="">All Branches</option>
            <option value="Army">Indian Army</option>
            <option value="Navy">Indian Navy</option>
            <option value="Air Force">Indian Air Force</option>
          </select>
        </div>

        <!-- State / UT -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Domicile State / UT</label>
          <select
            [ngModel]="filterService.filters().state"
            (ngModelChange)="onFilterChange('state', $event)"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
          >
            <option value="">All States / UTs</option>
            @for (st of states; track st) {
              <option [value]="st">{{ st }}</option>
            }
          </select>
        </div>

        <!-- Gender -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Gender</label>
          <select
            [ngModel]="filterService.filters().gender"
            (ngModelChange)="onFilterChange('gender', $event)"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
          >
            <option value="">All</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <!-- Rehabilitation / Absorption Status -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Rehabilitation Status</label>
          <select
            [ngModel]="filterService.filters().rehab_status"
            (ngModelChange)="onFilterChange('rehab_status', $event)"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
          >
            <option value="">All Candidates</option>
            <option value="Yes">Rehabilitated (Absorbed)</option>
            <option value="No">To Be Rehabilitated (Available)</option>
          </select>
        </div>

        <!-- Hired / Absorbed Entity (only if Rehabilitated) -->
        @if (filterService.filters().rehab_status === 'Yes') {
          <div>
            <label class="block font-bold text-slate-700 mb-1">Absorbed By (Entity)</label>
            <select
              [ngModel]="filterService.filters().hiredEntity"
              (ngModelChange)="onFilterChange('hiredEntity', $event)"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
            >
              <option value="">All Absorbing Entities</option>
              @for (ent of entities(); track ent._id) {
                <option [value]="ent.entity_name">{{ ent.entity_name }}</option>
              }
            </select>
          </div>
        }
      </div>
    </aside>
