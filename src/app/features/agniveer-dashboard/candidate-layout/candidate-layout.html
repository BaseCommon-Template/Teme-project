<div class="flex min-h-[calc(100vh-8rem)] bg-slate-50">
      <!-- Candidate Sidebar -->
      <aside
        [class.w-16]="isCollapsed()"
        [class.w-60]="!isCollapsed()"
        class="bg-gradient-to-b from-[#1a2a6c] to-[#1C4587] text-white flex flex-col pt-3 transition-all duration-300 overflow-x-hidden shrink-0 shadow-lg relative z-30 min-h-[calc(100vh-8rem)]"
      >
        <div class="px-3 py-2 flex items-center justify-between border-b border-white/10">
          @if (!isCollapsed()) {
            <span class="text-xs font-black tracking-wider uppercase text-blue-200">Candidate Menu</span>
          }
          <button
            (click)="isCollapsed.set(!isCollapsed())"
            class="p-1 rounded bg-white/10 hover:bg-white/20 text-white text-xs cursor-pointer border-none ml-auto"
          >
            {{ isCollapsed() ? '▶' : '◀' }}
          </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 p-2 space-y-1.5 mt-2">
          <a
            routerLink="/agniveerdashboard/profile"
            routerLinkActive="bg-white/20 text-white font-bold border-l-4 border-[#FF9933]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-white/80 hover:text-white hover:bg-white/10 transition-all no-underline"
            title="My Profile"
          >
            <span class="text-base shrink-0">👨🏻‍✈️</span>
            @if (!isCollapsed()) {
              <span>My Profile</span>
            }
          </a>

          <a
            routerLink="/agniveerdashboard/notifications"
            routerLinkActive="bg-white/20 text-white font-bold border-l-4 border-[#FF9933]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-white/80 hover:text-white hover:bg-white/10 transition-all no-underline"
            title="Job Notifications"
          >
            <span class="text-base shrink-0">🔔</span>
            @if (!isCollapsed()) {
              <span>Job Notifications</span>
            }
          </a>

          <a
            routerLink="/agniveerdashboard/consent"
            routerLinkActive="bg-white/20 text-white font-bold border-l-4 border-[#FF9933]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-white/80 hover:text-white hover:bg-white/10 transition-all no-underline"
            title="Consent & Data Sharing"
          >
            <span class="text-base shrink-0">📋</span>
            @if (!isCollapsed()) {
              <span>Consent</span>
            }
          </a>

          <a
            routerLink="/agniveerdashboard/grievance"
            routerLinkActive="bg-white/20 text-white font-bold border-l-4 border-[#FF9933]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-white/80 hover:text-white hover:bg-white/10 transition-all no-underline"
            title="Grievance Redressal"
          >
            <span class="text-base shrink-0">💬</span>
            @if (!isCollapsed()) {
              <span>Grievance</span>
            }
          </a>

          <a
            routerLink="/agniveerdashboard/feedback"
            routerLinkActive="bg-white/20 text-white font-bold border-l-4 border-[#FF9933]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-white/80 hover:text-white hover:bg-white/10 transition-all no-underline"
            title="Feedback & Suggestions"
          >
            <span class="text-base shrink-0">⭐</span>
            @if (!isCollapsed()) {
              <span>Feedback</span>
            }
          </a>
        </nav>

        <!-- Logout -->
        <div class="p-3 border-t border-white/10">
          <button
            (click)="onLogout()"
            class="w-full flex items-center justify-center gap-2 py-2 rounded-xl bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold transition-all cursor-pointer border-none"
          >
            <span>🚪</span>
            @if (!isCollapsed()) {
              <span>Sign Out</span>
            }
          </button>
        </div>
      </aside>

      <!-- Main Candidate Content Outlet -->
      <main class="flex-1 p-6 lg:p-8 overflow-y-auto min-w-0">
        <router-outlet />
      </main>
    </div>
