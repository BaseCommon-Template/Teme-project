<div class="flex flex-col items-center justify-center min-h-[65vh] px-4 bg-slate-50">
      <div class="bg-white border border-slate-200 p-8 sm:p-10 rounded-3xl shadow-sm max-w-md w-full text-center space-y-6">
        <!-- Icon -->
        <div class="flex items-center justify-center w-16 h-16 rounded-2xl bg-red-50 border border-red-100 mx-auto text-red-500 text-3xl font-bold">
          🛡️
        </div>

        <!-- Heading -->
        <div class="border-l-4 border-red-600 pl-4 text-left">
          <h1 class="text-xl font-bold text-slate-900 tracking-tight leading-tight m-0">
            Access Restricted
          </h1>
          <p class="text-slate-500 text-xs mt-1 m-0">
            You do not have permission to view this module.
          </p>
        </div>

        <!-- Message -->
        <div class="bg-slate-50 rounded-2xl p-5 text-left border border-slate-200">
          <p class="text-slate-600 text-xs italic m-0 leading-relaxed">
            "You do not have access to any module on this portal with your current role. Please switch to another assigned role or log in with an authorized account."
          </p>
        </div>

        <!-- Actions -->
        <div class="pt-2 flex flex-col gap-2">
          <button
            (click)="onLogout()"
            class="w-full py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold transition-all cursor-pointer border-none"
          >
            Switch Account / Login
          </button>
          <a
            routerLink="/"
            class="text-xs font-semibold text-slate-500 hover:text-slate-700 no-underline"
          >
            Go to Portal Home
          </a>
        </div>
      </div>
    </div>
