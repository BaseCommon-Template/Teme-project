<main class="bg-slate-50 py-10 px-4 sm:px-8 lg:px-16 " id="maincontent">
  <div class="max-w-7xl mx-auto space-y-8">
    <div class="border-l-4 border-blue-600 pl-4">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 m-0">Contact Us</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col gap-3">
        <div
          class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#629900"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-clock"
            aria-hidden="true"
          >
            <path d="M12 6v6l4 2"></path>
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
        </div>
        <h3 class="font-bold text-sm text-slate-900 m-0">Working Hours</h3>
        <p class="text-sm text-slate-600 m-0 leading-relaxed">
          Monday - Friday: 9:00 AM - 6:00 PM<br />
          Saturday - Sunday: Closed (National Holidays Observed)
        </p>
      </div>

      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col gap-3">
        <div
          class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center text-2xl"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-map-pin text-red-600"
            aria-hidden="true"
          >
            <path
              d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
            ></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <h3 class="font-bold text-sm text-slate-900 m-0">Office Address</h3>
        <p class="text-sm text-slate-600 m-0 leading-relaxed">
          Room No. 34089, 4th Floor, Kartavya Bhavan 3,<br />
          New Delhi - 110001, India
        </p>
      </div>

      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col gap-3">
        <div
          class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-mail text-blue-600"
            aria-hidden="true"
          >
            <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          </svg>
        </div>
        <h3 class="font-bold text-sm text-slate-900 m-0">Official Email</h3>
        <p class="text-sm text-slate-600 m-0 leading-relaxed">
          <a href="mailto:jscpg-mha@mha.gov.in" class="text-blue-600 hover:underline">
            jscpg-mha&#64;mha.gov.in </a
          ><br />
          General Helpdesk: support&#64;agniveer.nic.in
        </p>
      </div>
    </div>
  </div>
</main>
