<div class="bg-slate-50 py-10 px-4 sm:px-8 lg:px-16 min-h-[70vh]" id="maincontent">
      <div class="max-w-4xl mx-auto space-y-8">
        <div class="border-l-4 border-blue-600 pl-4">
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 m-0">
            Feedback & Suggestions
          </h1>
          <p class="text-xs text-slate-500 m-0 mt-1">
            Submit your feedback, comments, and suggestions to help us improve the portal
          </p>
        </div>

        @if (submitted()) {
          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-center space-y-3">
            <div class="text-3xl">✅</div>
            <h3 class="text-lg font-bold text-emerald-900 m-0">Thank You for Your Feedback!</h3>
            <p class="text-xs text-emerald-700 m-0">Your feedback has been successfully recorded.</p>
            <button
              (click)="resetForm()"
              class="px-5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 cursor-pointer border-none"
            >
              Submit Another Response
            </button>
          </div>
        } @else {
          <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm">
            <form (ngSubmit)="onSubmit()" class="space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">
                    Full Name *
                  </label>
                  <input
                    type="text"
                    [(ngModel)]="formData.name"
                    name="name"
                    required
                    placeholder="Enter your full name"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">
                    Email Address *
                  </label>
                  <input
                    type="email"
                    [(ngModel)]="formData.email"
                    name="email"
                    required
                    placeholder="Enter your email address"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">
                    Mobile Number *
                  </label>
                  <input
                    type="tel"
                    [(ngModel)]="formData.phone"
                    name="phone"
                    required
                    placeholder="Enter 10-digit mobile number"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">
                    Service ID
                  </label>
                  <input
                    type="text"
                    [(ngModel)]="formData.service_id"
                    name="service_id"
                    placeholder="Agniveer Service ID (if applicable)"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">
                  Your Message *
                </label>
                <textarea
                  [(ngModel)]="formData.message"
                  name="message"
                  required
                  rows="4"
                  placeholder="Type your feedback message here..."
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none resize-y"
                ></textarea>
              </div>

              <div class="pt-2 flex justify-end">
                <button
                  type="submit"
                  [disabled]="submitting()"
                  class="px-6 py-2.5 rounded-xl bg-[#1C4587] hover:bg-[#153466] text-white text-xs font-bold shadow-sm transition-all cursor-pointer border-none disabled:opacity-50"
                >
                  {{ submitting() ? 'Submitting...' : 'Submit Feedback' }}
                </button>
              </div>
            </form>
          </div>
        }
      </div>
    </div>
