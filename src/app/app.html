@if (isCheckingWebsiteAccess()) {

  <!-- Checking Website Access -->

  <div class="min-h-screen flex items-center justify-center bg-white">
    <div class="text-center">

      <div
        class="w-10 h-10 mx-auto mb-4 rounded-full border-4 border-slate-200 border-t-[#234161] animate-spin"
      ></div>

      <p class="text-sm text-slate-500">
        Checking website access...
      </p>

    </div>
  </div>

} @else if (hasWebsiteAccess()) {

  <!-- ============================= -->
  <!-- NORMAL WEBSITE -->
  <!-- ============================= -->

  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:p-3 focus:bg-[#1C4587] focus:text-white focus:font-bold focus:rounded-xl focus:shadow-lg focus:outline-none"
  >
    Skip to Main Content
  </a>

  <div
    class="min-h-screen flex flex-col bg-slate-50 text-slate-900 selection:bg-blue-600 selection:text-white"
  >

    <app-header />

    <app-navbar />

    <main
      id="main-content"
      class="flex-1 min-w-0"
      role="main"
    >
      <router-outlet />
    </main>

    <app-footer />

    <app-back-to-top />

    <app-unauthorized-dialog />

  </div>

} @else {

  <!-- ============================= -->
  <!-- ACCESS DENIED -->
  <!-- ============================= -->

  <div class="coming-soon-page">

    <div class="coming-soon-container">

      <div class="coming-soon-logo">
        <span>🚀</span>
      </div>

      <h1>Website Coming Soon</h1>

    </div>

  </div>

}
