<div class="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-50">
      @if (loading()) {
        <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-200 flex flex-col items-center gap-4 text-center">
          <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
          <h2 class="text-lg font-bold text-[#355f2d] m-0">Processing JanParichay SSO...</h2>
          <p class="text-xs text-slate-500 m-0">Please wait while we verify your government credentials.</p>
        </div>
      } @else if (error()) {
        <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-200 flex flex-col items-center gap-4 text-center max-w-sm">
          <div class="text-3xl">⚠️</div>
          <h2 class="text-base font-bold text-red-600 m-0">Login Verification Failed</h2>
          <p class="text-xs text-slate-600 m-0">{{ error() }}</p>
          <p class="text-[11px] text-slate-400 m-0">Redirecting to login...</p>
        </div>
      }
    </div>
